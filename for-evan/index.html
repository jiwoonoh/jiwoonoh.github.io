<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="A little surprise for Evan." />
    <meta property="og:title" content="A little something for Evan" />
    <meta property="og:description" content="Click to open." />
    <meta property="og:type" content="website" />
    <title>For Evan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rye&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="start-screen" id="startScreen">
      <button id="startButton">Click to start</button>
    </div>

    <button class="music-button" id="musicButton" aria-label="Pause Tishomingo" hidden>
      <span id="musicIcon">Ⅱ</span>
      <span>Tishomingo</span>
    </button>

    <main>
      <section class="scene intro active" data-scene="0">
        <div class="intro-content">
          <h1>Hi Evan!</h1>
          <div class="bubble">Hey Evan, I’ve got something to tell you.</div>
          <button class="next-button" data-next>Click to proceed</button>
        </div>
        <img src="assets/zach-hello.png" alt="Zach Bryan waving with a guitar" />
      </section>

      <section class="scene image-scene" data-scene="1" aria-hidden="true">
        <img class="background" src="assets/zach-roadtrip.png" alt="Zach Bryan leaning from a vintage pickup" />
        <div class="message">
          <div class="bubble">I heard you are coming down to Baltimore to celebrate Yom Kippur!</div>
          <button class="next-button" data-next>Continue</button>
        </div>
      </section>

      <section class="scene image-scene" data-scene="2" aria-hidden="true">
        <img class="background" src="assets/zach-horse.png" alt="Zach Bryan riding a horse" />
        <div class="message">
          <div class="bubble">Do you want to stop by at Delaware?</div>
          <button class="next-button" data-next>Continue</button>
        </div>
      </section>

      <section class="scene reveal" data-scene="3" aria-hidden="true">
        <div class="reveal-content">
          <h2>Thanks to your amazing girlfriend Jiwoo, you can come see me sing!!!</h2>
          <p>September 19, 2026 · Dover, Delaware</p>
          <img src="assets/tickets.jpg" alt="Two tickets to see Zach Bryan on September 19, 2026" />
          <div class="reveal-buttons">
            <button class="next-button" id="celebrateButton">Best girlfriend ever</button>
            <button class="simple-button" data-go="0">Start over</button>
          </div>
        </div>
      </section>
    </main>

    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <audio
      id="backgroundMusic"
      src="https://audio-ssl.itunes.apple.com/itunes-assets/AudioPreview221/v4/84/d0/61/84d06146-67a6-66ff-668a-a88cff5361e3/mzaf_18157382529574981460.plus.aac.p.m4a"
      preload="auto"
      loop
    ></audio>
    <script src="script.js"></script>
  </body>
</html>
